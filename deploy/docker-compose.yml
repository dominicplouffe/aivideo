# DemoRiff on one server: Postgres, the web app, the render worker, and
# Caddy for HTTPS. Placed at /opt/demoriff by scripts/lightsail.sh, beside:
#   .env      IMAGE, POSTGRES_PASSWORD, DOMAIN, ACME_EMAIL (for this file)
#   app.env   the app's own settings and secrets (deploy/.env.production)
#   Caddyfile
name: demoriff

x-app: &app
  image: ${IMAGE}
  restart: unless-stopped
  env_file: app.env
  environment:
    NODE_ENV: production
    # Recordings, renders and logos on the server's disk, shared by the web
    # app and the worker, and included in the server's daily snapshots.
    STORAGE_DRIVER: local
    STORAGE_LOCAL_ROOT: /data/storage
  volumes:
    - storage:/data/storage
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: demoriff
      POSTGRES_DB: demoriff
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demoriff -d demoriff"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    <<: *app
    command: ["npx", "next", "start", "-H", "0.0.0.0", "-p", "3000"]

  worker:
    <<: *app
    command: ["npx", "tsx", "lib/render/scripts/worker.ts"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:

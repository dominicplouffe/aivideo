name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # next/font downloads and self-hosts the font files during the build,
      # so this step needs network access. It is also the step that catches
      # server/client boundary mistakes, which typecheck alone does not.
      - name: Build
        run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: demoriff
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/demoriff
      E2E_BASE_URL: http://localhost:3000
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: ./.storage
      # Deterministic in CI, and never a deployment's real secret. Every one
      # of these is required in production, where a shared constant would
      # mean every deployment could read every other one's.
      DEMORIFF_SESSION_SECRET: ci-session-secret-not-for-production
      DEMORIFF_SECRET_KEY: ci-secret-key-not-for-production
      DEMORIFF_SSO_STATE_SECRET: ci-sso-state-not-for-production
      DEMORIFF_LINK_SECRET: ci-link-secret-not-for-production
      STORAGE_SIGNING_SECRET: ci-storage-signing-not-for-production
      RENDER_WORKER_ID: ci-worker
      RENDER_WORKER_POLL_MS: "500"

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Not optional. The render tests assert on a real encoded file, and a
      # suite that skipped them would go green while rendering was broken.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Migrate
        run: npm run db:migrate

      # Deliberately no `db:seed`. The suite creates its own workspaces
      # through the real signup route, because a workspace that has just been
      # created is the state these tests exist to check.
      - name: Unit tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: scripts/test-env.sh
